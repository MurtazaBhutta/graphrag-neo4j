# `docker compose up --build -d --wait`, then load data:
#   docker compose run --rm api python -m graphrag load --jobs 50000
# /ask needs a model: ANTHROPIC_API_KEY in your shell, or GRAPHRAG_LLM_PROVIDER=azure_openai with
# the AZURE_OPENAI_* variables. /query and /health need neither.

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/graphrag-dev
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"  # browser: http://localhost:7474
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p graphrag-dev 'RETURN 1'"]
      interval: 5s
      timeout: 10s
      retries: 30

  api:
    build: .
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphrag-dev
      GRAPHRAG_LLM_PROVIDER: ${GRAPHRAG_LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
    ports:
      - "8000:8000"
    depends_on:
      neo4j: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
