[project]
name = "graphrag-neo4j"
version = "0.1.0"
description = "Graph RAG over a Neo4j field-service knowledge graph, benchmarked against plain vector RAG."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "neo4j>=5.20",
    "fastembed>=0.4",
    "numpy>=1.26",
    "anthropic>=2.14",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["graphrag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "neo4j: needs a running Neo4j with the benchmark world loaded; skipped otherwise",
]
